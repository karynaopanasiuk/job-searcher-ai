name: watch-boards
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: watch-boards
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check boards
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXTRA_REGIONS: ${{ vars.EXTRA_REGIONS }}
          UIUX_EXTRA_PAGES: ${{ vars.UIUX_EXTRA_PAGES }}
          CHROME_BIN: /usr/bin/google-chrome
          CHROME_TIMEOUT: "60"
        run: python watch_boards.py
      - name: Save state
        if: always()
        run: |
          git config user.name "board-watch"
          git config user.email "board-watch@users.noreply.github.com"
          git add boards_seen.json skipped.json source_state.json
          git diff --cached --quiet || (git commit -m "state" && git pull --rebase -q && git push)
